# Bật HTTPS cho docker-compose.yml (ghép thêm, không thay file chính):
#
#   sh deploy/tao-chung-chi-tu-ky.sh            # lần đầu: chứng chỉ tự ký cho localhost (có tên miền vẫn cần để nginx khởi động)
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
#   mở https://localhost:8443 (trình duyệt cảnh báo chứng chỉ tự ký → "Nâng cao" → "Tiếp tục")
#
# Có tên miền: trỏ bản ghi A về máy chủ, mở cổng 80 và 443 ra Internet, đặt trong .env
#   COMPOSE_PROFILES=letsencrypt, LE_DOMAINS=ten-mien, LE_EMAIL=email-lien-he,
#   HTTP_PORT=80, HTTPS_PORT=443, APP_WEB_BASE_URL_HTTPS=https://ten-mien
# rồi chạy lại lệnh up. Service certbot xin chứng chỉ, 12 giờ kiểm gia hạn một lần và chép vào deploy/certs; nginx tự tải lại
# trong vòng 1 phút. Trình duyệt báo chứng chỉ hợp lệ rồi mới đặt HSTS_MAX_AGE=31536000.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    # Chạy bằng "sh" vì clone trên VPS không giữ quyền thực thi của file soạn trên Windows.
    entrypoint: ["sh", "/khoi-dong-https.sh"]
    ports:
      - "${HTTPS_PORT:-8443}:443"
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-0}
    volumes:
      - ./deploy/nginx/https.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./deploy/nginx/khoi-dong-https.sh:/khoi-dong-https.sh:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - acme-webroot:/var/www/certbot:ro

  api:
    environment:
      # Cookie phiên và cookie XSRF-TOKEN chỉ gửi qua HTTPS.
      APP_COOKIE_SECURE: "true"
      APP_WEB_BASE_URL: ${APP_WEB_BASE_URL_HTTPS:-https://localhost:8443}

  certbot:
    image: certbot/certbot:v5.8.0
    profiles: [letsencrypt]
    restart: unless-stopped
    depends_on:
      nginx: { condition: service_started }
    entrypoint: ["sh", "/gia-han.sh"]
    environment:
      LE_DOMAINS: ${LE_DOMAINS:-}
      LE_EMAIL: ${LE_EMAIL:-}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./deploy/certbot/gia-han.sh:/gia-han.sh:ro
      - ./deploy/certs:/certs
      - acme-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    # Chỉ cần ra Internet gọi Let's Encrypt; xác minh qua volume chung với nginx, không chạm API hay CSDL.
    networks: [jobs]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
    security_opt: [no-new-privileges:true]
    logging: *logging

volumes:
  acme-webroot: {}
  letsencrypt: {}
